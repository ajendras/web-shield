[package]
name = "web-shield"
version = "0.1.0"
edition = "2021"
authors = ["Web Shield Contributors"]
description = "Passive web security scanner with local LLM explanations"
license = "MIT OR Apache-2.0"
repository = "https://github.com/web-shield/web-shield"
readme = "README.md"
keywords = ["security", "scanner", "llm", "ratatui", "ollama"]
categories = ["command-line-utilities", "security"]

[[bin]]
name = "web-shield"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
ratatui = "0.27"
crossterm = { version = "0.28", features = ["event-stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "1.0"
url = "2.5"
regex = "1.10"

[dev-dependencies]
mockito = "1.4"

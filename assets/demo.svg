<svg xmlns="http://www.w3.org/2000/svg" width="900" height="572" viewBox="0 0 900 572" role="img" aria-label="Web Shield — demo">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;font-size:15px}
    .l{opacity:0}
    .ty{clip-path:inset(0 100% 0 0)}
    .cur{animation:blink 1s steps(1) infinite}
    @keyframes show{to{opacity:1}}
    @keyframes type{to{clip-path:inset(0 0 0 0)}}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.l{opacity:1;animation:none!important}.ty{clip-path:none;animation:none!important}}
  </style>
  <rect width="900" height="572" rx="14" fill="#0d1117"/>
  <rect x=".5" y=".5" width="899" height="572" rx="14" fill="none" stroke="#30363d"/>
  <rect width="900" height="40" rx="14" fill="#161b22"/><rect y="26" width="900" height="14" fill="#161b22"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f57"/><circle cx="44" cy="20" r="6" fill="#febc2e"/><circle cx="64" cy="20" r="6" fill="#28c840"/>
  <text x="450" y="25" text-anchor="middle" fill="#8b949e" style="font-size:13px">Web Shield — demo</text>
<text x="28" y="74" class="l" style="animation:show .01s 0.60s forwards"><tspan fill="#39ff14">❯</tspan></text><text x="50" y="74" class="l ty" style="animation:show .01s 0.60s forwards,type 1.08s steps(24) 0.60s forwards" fill="#e5e7eb">cargo install web-shield</text>
<text x="50" y="100" class="l" style="animation:show .01s 1.98s forwards" fill="#94a3b8">Updating crates.io index</text>
<text x="50" y="126" class="l" style="animation:show .01s 2.20s forwards" fill="#94a3b8">Compiling web-shield v0.1.0</text>
<text x="50" y="152" class="l" style="animation:show .01s 2.42s forwards" fill="#94a3b8">Installed package `web-shield` (bin `web-shield`)</text>
<text x="28" y="204" class="l" style="animation:show .01s 2.99s forwards"><tspan fill="#39ff14">❯</tspan></text><text x="50" y="204" class="l ty" style="animation:show .01s 2.99s forwards,type 1.58s steps(35) 2.99s forwards" fill="#e5e7eb">web-shield scan https://example.com</text>
<text x="50" y="230" class="l" style="animation:show .01s 4.87s forwards" fill="#94a3b8">🔍 Scanning https://example.com ...</text>
<text x="50" y="256" class="l" style="animation:show .01s 5.09s forwards" fill="#94a3b8">5 findings • score 62/100</text>
<text x="50" y="282" class="l" style="animation:show .01s 5.31s forwards" fill="#94a3b8">High: Missing CSP header</text>
<text x="50" y="308" class="l" style="animation:show .01s 5.53s forwards" fill="#94a3b8">Medium: Server header leaks Apache 2.4.41</text>
<text x="28" y="360" class="l" style="animation:show .01s 6.10s forwards"><tspan fill="#39ff14">❯</tspan></text><text x="50" y="360" class="l ty" style="animation:show .01s 6.10s forwards,type 2.03s steps(45) 6.10s forwards" fill="#e5e7eb">web-shield analyze scan.json --model llama3.2</text>
<text x="50" y="386" class="l" style="animation:show .01s 8.43s forwards" fill="#94a3b8">Consulting local LLM...</text>
<text x="50" y="412" class="l" style="animation:show .01s 8.65s forwards" fill="#94a3b8">Risk: Clickjacking possible because X-Frame-Options is absent.</text>
<text x="50" y="438" class="l" style="animation:show .01s 8.87s forwards" fill="#94a3b8">Fix: Add &quot;X-Frame-Options: DENY&quot; or a strict CSP with frame-ancestors &apos;none&apos;.</text>
<text x="28" y="490" class="l" style="animation:show .01s 9.44s forwards"><tspan fill="#39ff14">❯</tspan></text><text x="50" y="490" class="l ty" style="animation:show .01s 9.44s forwards,type 2.20s steps(54) 9.44s forwards" fill="#e5e7eb">web-shield scan https://example.com --output report.md</text>
<text x="50" y="516" class="l" style="animation:show .01s 11.94s forwards" fill="#94a3b8">Report written to report.md</text>
<g class="l" style="animation:show .01s 12.16s forwards"><text x="28" y="542" fill="#39ff14">❯</text><rect class="cur" x="50" y="527" width="10" height="18" fill="#e5e7eb"/></g>
</svg>

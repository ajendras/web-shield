# Web Shield — Embedded default rule set
#
# These rules extend the built-in detectors (check_security_headers,
# evaluate_csp, check_cors_headers). They are loaded automatically
# when no --rules file is supplied. Rules without a `header` key
# are always applied (useful for policy reminders). Rules with a
# `header` are triggered when that header is present in the response.
#
# Severity values must be lowercase to match the serialized enum.

- id: x-powered-by-disclosure
  header: x-powered-by
  severity: medium
  title: X-Powered-By header discloses backend technology
  description: Revealing the exact runtime or framework version assists attackers in selecting targeted exploits and CVEs.
  recommendation: |
    Remove or suppress the X-Powered-By header.
    Nginx: proxy_hide_header X-Powered-By;
    Apache: Header unset X-Powered-By
    Next.js:
      // next.config.js
      module.exports = {
        poweredByHeader: false,
      }
    Django: Use custom middleware to remove the header (or avoid setting it).
    Rails:
      # config/application.rb
      config.action_dispatch.default_headers.delete('X-Powered-By')
      # Usually best handled at the web-server (Nginx/Apache) level

- id: server-version-info
  header: server
  severity: low
  title: Server header leaks version or technology
  description: The Server response header often includes software name and version, reducing attacker effort.
  recommendation: |
    Configure a generic server header or remove it.
    Nginx: server_tokens off;
    Apache: ServerTokens Prod
    Next.js: Handled via Vercel config or a custom server.
    Django: Use WhiteNoise + web server config (or custom middleware).
    Rails:
      # config/environments/production.rb
      config.force_ssl = true
      # Combine with Nginx/Apache server_tokens off;

- id: csp-report-only-active
  header: content-security-policy-report-only
  severity: info
  title: Content-Security-Policy-Report-Only header in use
  description: Report-only mode is excellent for monitoring but does not block violating resources.
  recommendation: |
    Deploy a strong enforcing CSP alongside the Report-Only policy:
    Content-Security-Policy: default-src 'self'; script-src 'self' 'nonce-abc123';
    Next.js:
      // next.config.js
      module.exports = {
        async headers() {
          return [{
            source: '/(.*)',
            headers: [{
              key: 'Content-Security-Policy',
              value: "default-src 'self'; script-src 'self' 'nonce-abc123'; object-src 'none';"
            }]
          }]
        }
      }
    Django:
      # settings.py (with django-csp)
      CSP_DEFAULT_SRC = ("'self'",)
      CSP_SCRIPT_SRC = ("'self'", "'nonce-abc123'")
    Rails:
      # config/initializers/content_security_policy.rb
      Rails.application.config.content_security_policy do |policy|
        policy.default_src :self
        policy.script_src  :self, "'nonce-abc123'"
      end

- id: recommend-security-txt
  severity: low
  title: Consider publishing a security.txt file
  description: A machine-readable security.txt makes it easy for security researchers to contact you responsibly.
  recommendation: |
    Create .well-known/security.txt with at least:
    Contact: mailto:security@example.com
    Expires: 2025-12-31T23:59:59Z
    Canonical: https://example.com/.well-known/security.txt

- id: hsts-preload-recommended
  header: strict-transport-security
  severity: low
  title: HSTS header should include the preload directive
  description: The preload token allows submission to browser HSTS preload lists for stronger protection against SSL stripping.
  recommendation: |
    Update your HSTS header:
    Strict-Transport-Security: max-age=31536000; includeSubDomains; preload
    Then submit your domain at https://hstspreload.org

    Framework examples:
    Next.js: Use the headers() function in next.config.js to set the header.
    Django:
      # settings.py
      SECURE_HSTS_SECONDS = 31536000
      SECURE_HSTS_INCLUDE_SUBDOMAINS = True
      SECURE_HSTS_PRELOAD = True
    Rails:
      # config/environments/production.rb
      config.force_ssl = true
      # This automatically adds a strong HSTS header

- id: cookie-review
  header: set-cookie
  severity: medium
  title: Review cookie security attributes
  description: Cookies observed; confirm they all carry Secure, HttpOnly, and an appropriate SameSite policy.
  recommendation: |
    Ensure every cookie uses Secure, HttpOnly and SameSite=Lax (or Strict).
    Next.js (API route):
      res.setHeader('Set-Cookie', 'session=abc123; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=3600')
    Django:
      response.set_cookie(
          'sessionid', 'abc123',
          secure=True, httponly=True, samesite='Lax'
      )
    Rails:
      cookies['session'] = {
        value: 'abc123',
        secure: true,
        httponly: true,
        same_site: :lax,
        max_age: 3600
      }
    Server config fallback (Nginx):
      add_header Set-Cookie "Secure; HttpOnly; SameSite=Lax" always;
